name: Secret Detection

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect secrets
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          path: ./
          base: ""
          head: HEAD
          extra_args: --only-verified

      - name: Pattern check for common secret formats
        run: |
          echo "Checking for hardcoded secrets..."
          FOUND=0
          # API keys, tokens, passwords in YAML/JSON
          if grep -rn \
            -e 'sk-[a-zA-Z0-9]\{20,\}' \
            -e 'ghp_[a-zA-Z0-9]\{36\}' \
            -e 'gho_[a-zA-Z0-9]\{36\}' \
            -e 'password\s*[:=]\s*["\x27][^"\x27]\{8,\}' \
            -e 'secret\s*[:=]\s*["\x27][^"\x27]\{8,\}' \
            --include="*.yml" --include="*.yaml" --include="*.json" \
            .; then
            echo "::error::Potential secrets found in workflow files"
            FOUND=1
          fi
          if [ "$FOUND" -eq 1 ]; then
            exit 1
          fi
          echo "No hardcoded secrets found"

      - name: Verify pinned actions and images
        run: .github/scripts/verify-pinned-refs.sh
